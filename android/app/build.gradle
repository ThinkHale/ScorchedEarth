apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.thinkhale.scorchedearth"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // We use rootProject.file to ensure we are looking relative to the 'android/' folder
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath) {
                    storeFile = rootProject.file(storeFilePath)
                    storePassword = keystoreProperties['storePassword']
                    keyAlias = keystoreProperties['keyAlias']
                    keyPassword = keystoreProperties['keyPassword']
                    
                    println "SIGNING CONFIG: Using keystore at ${storeFile.absolutePath}"
                    if (!storeFile.exists()) {
                        throw new GradleException("CRITICAL ERROR: Keystore file not found at ${storeFile.absolutePath}")
                    }
                } else {
                    throw new GradleException("CRITICAL ERROR: 'storeFile' not defined in key.properties")
                }
            } else {
                println "WARNING: key.properties not found at ${keystorePropertiesFile.absolutePath}"
            }
        }
    }

    defaultConfig {
        applicationId "com.thinkhale.scorchedearth"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // FORCE release signing. If it's not configured correctly, the build SHOULD fail.
            if (keystorePropertiesFile.exists() && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                println "ERROR: Release signing configuration is missing! Build will likely fail or use debug keys if not careful."
                // No fallback to debug here - we want to know if it's broken.
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
